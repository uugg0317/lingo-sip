<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语滴 · 连学</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="study.css" />
  </head>
  <body data-state="loading">
    <header class="bar topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2.5 4-7 8.2-7 12a7 7 0 0 0 14 0c0-3.8-4.5-8-7-12Z"/><path d="M8 15a4 4 0 0 0 4 4"/></svg></span>语滴 · 连学</span>
      <span class="counter" id="counter" role="status" aria-atomic="true">本次完成 0 张</span>
      <button class="ghost" id="closeBtn" title="关闭学习窗" aria-label="关闭学习窗"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>

    <main id="stage" class="stage" aria-label="当前学习卡片"></main>
    <p id="studyStatus" class="study-status" role="status" aria-live="polite"></p>

    <footer class="bar foot">
      <button class="primary" id="nextBtn" title="下一张（N）">下一张<kbd class="kbd" aria-hidden="true">N</kbd></button>
      <button class="ghost" id="pauseBtn" title="暂停自动提醒 1 小时" aria-label="暂停自动提醒 1 小时"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>暂停提醒</button>
    </footer>

    <script type="module" src="study.js"></script>
  </body>
</html>
