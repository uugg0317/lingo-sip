<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语滴 Lingo Sip</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">语滴 <small>LINGO SIP</small></span>
      </div>
      <span id="status" class="status">加载中…</span>
    </header>

    <section class="progress" aria-label="今日学习进度">
      <div class="ring" id="ring" role="progressbar" aria-label="今日目标" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
          <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="18"></circle>
        </svg>
        <div class="ring-text"><b id="todayCount">0</b><span id="goalCount">/20</span></div>
      </div>
      <div class="progress-text">
        <p class="goal-metric" id="goalMetric">今日展示目标</p>
        <p class="line1" id="progressLine">今天还没开始</p>
        <p class="line2" id="streakLine">连续 0 天</p>
      </div>
    </section>

    <section class="today-details" aria-label="今日展示与主动完成"><div><span>看过卡片</span><b id="shownToday">0</b></div><div><span>主动完成</span><b id="answeredToday">0</b></div></section>
    <p class="category-details">新词展示 <b id="newShownToday">0</b> · 复习完成 <b id="reviewAnsweredToday">0</b><span class="category-note" id="categoryNote" hidden aria-label="分类未完整记录，分类统计从升级后开始记录">（分类未完整记录）</span></p>

    <section class="stats">
      <div class="cell"><b id="dueCount">0</b><span>待复习</span></div>
      <div class="cell"><b id="newCount">0</b><span>新词剩余额度</span></div>
      <div class="cell"><b id="masteredCount">0</b><span>已掌握</span></div>
    </section>

    <button class="primary" id="studyNow">立即学一张 <span aria-hidden="true">→</span></button>

    <section class="pause">
      <p class="label">暂停自动出现</p>
      <div class="chips" id="pauseChips"></div>
    </section>

    <section class="switch-row">
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">在空档自动出现<small>关闭后仍可手动学习</small></span>
      </label>
    </section>

    <p class="feedback" id="feedback" role="status"></p>
    <footer class="foot">
      <button class="link" id="openOptions">设置与词库</button>
      <button class="link" id="openLog">为什么没弹？</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
