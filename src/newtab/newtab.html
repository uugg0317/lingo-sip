<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语滴 · 新标签页</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="nt">
      <header class="nt__head">
        <a class="nt__brand" href="newtab.html" aria-label="语滴首页">
          <span class="nt__mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3S5.5 10.1 5.5 14.2a6.5 6.5 0 0 0 13 0C18.5 10.1 12 3 12 3Z"/><path d="M9 14.5a3 3 0 0 0 3 3" stroke-linecap="round"/></svg></span>
          <span>语滴 <small>LINGO SIP</small></span>
        </a>
        <div class="nt__head-end"><p class="nt__date" id="ntDate">今天，又是新的一天</p><button class="nt__settings" type="button" id="ntOptions">设置与词库 <span aria-hidden="true">↗</span></button></div>
      </header>
      <section class="nt__intro" aria-labelledby="ntTitle">
        <p class="nt__eyebrow">A LITTLE, EVERY DAY</p>
        <h1 id="ntTitle">让英语，一点点成为日常。</h1>
        <p class="nt__subtitle">从一个单词开始，把等待的片刻留给自己。</p>
      </section>
      <form class="nt__search" id="ntSearchForm" role="search">
        <svg aria-hidden="true" viewBox="0 0 20 20" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.75" cy="8.75" r="5.25"/><path d="M12.6 12.6 16.4 16.4"/></svg>
        <input type="search" id="ntQuery" placeholder="搜索内容，或输入网址" autocomplete="off" autofocus aria-label="搜索内容或输入网址" />
        <button type="submit" aria-label="开始搜索">搜索 <span aria-hidden="true">↵</span></button>
      </form>
      <div class="nt__workspace">
        <section class="nt__learning" aria-labelledby="learningTitle">
          <div class="nt__section-head"><h2 id="learningTitle">片刻学习</h2><span>每张卡片，一点积累</span></div>
          <div class="nt__slot" id="ntCardSlot" aria-label="单词学习卡片"></div>
          <div class="nt__bar">
            <span class="nt__keys"><kbd>1</kbd> 记得了 <kbd>2</kbd> 稍后复习 <kbd>空格</kbd> 发音</span>
            <button type="button" id="ntNext">换一张 <span aria-hidden="true">↻</span></button>
          </div>
          <p class="nt__hint" id="ntHint" role="status"></p>
        </section>
        <aside class="nt__overview" aria-labelledby="overviewTitle">
          <div class="nt__section-head"><h2 id="overviewTitle">今日足迹</h2><span class="nt__live">本地记录</span></div>
          <section class="nt__summary">
            <div class="nt__goal-label"><span id="ntGoalMetric">今日展示目标</span><span id="ntPercent">0%</span></div>
            <p class="nt__goal"><strong id="ntToday">0</strong><span>/ <span id="ntGoal">20</span> 张</span></p>
            <progress id="ntGoalBar" max="100" value="0" aria-label="今日目标完成度"></progress>
            <p id="ntProgress" class="nt__progress-note" role="status">正在读取学习进度…</p>
            <div class="nt__today-details" aria-label="今日展示与主动完成"><div><span>看过卡片</span><strong id="ntShown">0</strong></div><div><span>主动完成</span><strong id="ntAnswered">0</strong></div></div>
            <p class="nt__category-details">新词展示 <strong id="ntNewShown">0</strong> · 复习完成 <strong id="ntReviewAnswered">0</strong></p>
            <p class="nt__category-note" id="ntCategoryNote" hidden>分类统计从升级后开始记录</p>
            <div class="nt__stats"><div><strong id="ntStreak">0</strong><span id="ntStreakLabel">连续接触</span></div><div><strong id="ntDue">0</strong><span>到期复习</span></div><div><strong id="ntMastered">0</strong><span>已掌握</span></div></div>
            <div class="nt__week-head"><span>最近 7 天</span><span id="ntWeekMetric">展示张数</span></div>
            <div class="nt__week" id="ntWeek" aria-label="最近七天学习记录"></div>
          </section>
          <button class="nt__study" type="button" id="ntStudy"><span>进入连学模式<small>留一会儿，专注多学几张</small></span><span aria-hidden="true">→</span></button>
        </aside>
      </div>
      <footer class="nt__footer"><span>小小一滴，慢慢积累。</span><span>无需登录 · 学习数据保存在本机</span></footer>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
